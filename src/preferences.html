<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <title>Preferences</title>
  </head>

  <body class="bg-gray-800 flex justify-center items-center h-screen">
    <form
      id="settingsForm"
      class="bg-gray-700 text-white p-8 rounded-lg shadow-lg w-full max-w-md"
    >
      <p class="text-lg font-semibold mb-2">Anna's Archive mirror:</p>
      <p class="text-sm text-gray-300 mb-3">
        Articles and books are both opened through this address. Change it if
        the default mirror is unreachable.
      </p>

      <input
        type="text"
        id="annasArchiveUrl"
        name="annasArchiveUrl"
        list="annasArchiveMirrors"
        placeholder="https://annas-archive.gl/"
        spellcheck="false"
        autocomplete="off"
        class="w-full px-3 py-2 bg-gray-600 text-white rounded border border-gray-500 focus:outline-none focus:border-blue-500"
      />
      <datalist id="annasArchiveMirrors">
        <option value="https://annas-archive.gl/"></option>
        <option value="https://annas-archive.org/"></option>
        <option value="https://annas-archive.se/"></option>
        <option value="https://annas-archive.li/"></option>
      </datalist>

      <button
        type="button"
        id="resetUrl"
        class="text-sm text-blue-400 hover:text-blue-300 mt-2 focus:outline-none"
      >
        Reset to default
      </button>

      <div class="mb-6 mt-6">
        <label class="flex items-center mb-2">
          <input
            type="checkbox"
            name="openInTheCurrentTab"
            value="true"
            class="form-checkbox text-blue-600"
          />
          <span class="ml-2">Open new pages in the current tab</span>
        </label>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
      >
        Save
      </button>

      <div class="notification mt-4 p-2 text-sm text-green-500 hidden">
        Settings updated!
      </div>
      <div class="error mt-4 p-2 text-sm text-red-400 hidden"></div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
